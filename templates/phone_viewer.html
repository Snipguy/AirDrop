<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Files</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 25px;
            font-size: 28px;
            font-weight: 600;
        }

        .container {
            width: 92%;
            max-width: 500px;
            margin: 20px auto;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a2a;
            padding: 14px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .file-item:hover {
            background: #333333;
        }

        .file-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        .file-name {
            flex-grow: 1;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-btn {
            background: #00bcd4;
            color: #000;
            padding: 7px 13px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #ccc;
            font-size: 16px;
        }
    </style>

</head>
<body>

    <h1>Shared PC Files</h1>

    <div class="container">

        {% if files %}
            {% for f in files %}
            <div class="file-item">
                <span class="file-icon">📄</span>
                <span class="file-name">{{ f }}</span>
                <a class="download-btn" href="/download/{{ f }}">Download</a>
            </div>
            {% endfor %}
        {% else %}
            <p class="empty">No files found in the shared folder.</p>
        {% endif %}

    </div>

</body>
</html>
