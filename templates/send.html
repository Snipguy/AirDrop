{% extends "base.html" %} {% block content %}


<script src="{{ url_for('static', filename='app.js') }}"></script>

<div class="card">

    <div class="top-bar">
        <h2>📡 AirDrop</h2>

        <div class="don-bar">
            <a href="https://coffeebede.com/snipguy" target="_blank">
                <img class="img-fluid" src=".\static\default-yellow.svg" />
            </a>
        </div>

        <div class="actions">
            <button class="icon-btn" onclick="toggleTheme()">🌗</button>
            <a href="{{ url_for('logout') }}">
                <button class="icon-btn logout">🚪</button>
            </a>
        </div>
    </div>

    <div class="section">
        <textarea id="text" placeholder="✉️ Send a quick message..."></textarea>
        <button onclick="sendText()">🚀 Send Text</button>
    </div>

    <div class="section">
        <div id="dropZone">📂 Drag & Drop File</div>
        <input type="file" id="fileInput" hidden>
        <button onclick="document.getElementById('fileInput').click()">📁 Choose File</button>

        <div class="progress-container">
            <div id="uploadBar"></div>
        </div>
        <div id="successCheck" class="checkmark">✔</div>
        <div id="uploadInfo" style="font-size:12px; opacity:0.7; margin-top:6px;"></div>
    </div>

    <div class="section">
        <h3>📜 Recent Files</h3>
        <ul id="fileHistory"></ul>
    </div>

</div>

{% endblock %}
