<!DOCTYPE html>
    <html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body {
                margin:0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: linear-gradient(135deg, #1e1e2f, #121212);
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                color:white;
            }

            .card {
                display:block;
                background:#1c1c1c;
                padding:40px 30px;
                border-radius:25px;
                width:90%;
                max-width:400px;
                text-align:center;
                box-shadow:0 10px 40px rgba(0,0,0,0.6);
            }

            h1 {
                margin-bottom:20px;
                font-weight:600;
            }

            input {
                width:90%;
                padding:16px;
                border:none;
                border-radius:15px;
                font-size:18px;
                margin-top:10px;
                background:#2a2a2a;
                color:white;
                text-align:center;
                letter-spacing:3px;
            }

            button {
                width:100%;
                padding:16px;
                border:none;
                border-radius:15px;
                margin-top:15px;
                font-size:18px;
                font-weight:600;
                background:#00c853;
                color:white;
                cursor:pointer;
            }

            button:active {
                transform:scale(0.97);
            }

            .hint {
                margin-top:15px;
                font-size:14px;
                color:#aaa;
            }
        </style>
    </head>
    <body>
        <div>
            <a href="https://coffeebede.com/snipguy"><img class="img-fluid" src=".\static\default-yellow.svg" /></a>
        </div>
        <div class="card">
            <h1>🔐 Unlock PC (OFFLINE)</h1>
            <form method="POST">
                <input type="password" name="password" placeholder="Enter PIN" autofocus>
                <button type="submit">Unlock</button>
            </form>
            <div class="hint">Scan QR from PC screen for instant login</div>
        </div>
    </body>
    </html>
